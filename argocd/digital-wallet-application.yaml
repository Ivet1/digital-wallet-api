apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digital-wallet-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ivet1/digital-wallet-api'
    targetRevision: HEAD
    path: DigitalWallet.Api/digital-wallet-chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
