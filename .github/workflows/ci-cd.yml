name: Digital Wallet CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    name: Test, Build & Containerize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          LOWER_REPO=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${LOWER_REPO}" >> "$GITHUB_ENV"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore DigitalWallet.slnx

      - name: Build Project
        run: dotnet build DigitalWallet.slnx --no-restore --configuration Release

      - name: Run All Unit & Integration Tests
        run: dotnet test DigitalWallet.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload Test Coverage Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: '**/TestResults/'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./DigitalWallet.Api
          file: ./DigitalWallet.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployment-smoke-test:
    name: Deployment Smoke Test (kind + Vault + DB)
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout API Repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          LOWER_REPO=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${LOWER_REPO}" >> "$GITHUB_ENV"

      - name: Checkout Deploy Repository
        uses: actions/checkout@v4
        with:
          repository: Ivet1/digital-wallet-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy-repo

      - name: Create kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: wallet-smoke
          wait: 120s

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Start Postgres for Smoke Test
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: postgres-smoke
            labels:
              app: postgres
          spec:
            containers:
              - name: postgres
                image: postgres:15-alpine
                env:
                  - name: POSTGRES_DB
                    value: walletdb
                  - name: POSTGRES_USER
                    value: postgres
                  - name: POSTGRES_PASSWORD
                    value: smokepass123
                ports:
                  - containerPort: 5432
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "postgres", "-d", "walletdb"]
                  initialDelaySeconds: 3
                  periodSeconds: 3
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-service
          spec:
            selector:
              app: postgres
            ports:
              - port: 5432
                targetPort: 5432
          EOF
          kubectl wait --for=condition=Ready pod/postgres-smoke --timeout=120s

      - name: Install Vault & Configure Secret + Kubernetes Auth
        run: |
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo update
          helm upgrade --install vault hashicorp/vault \
            --set "server.dev.enabled=true" \
            --set "server.dev.devRootToken=root" \
            --set "injector.enabled=true" \
            --wait --timeout=180s

          kubectl wait --for=condition=Ready pod/vault-0 --timeout=120s
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/component=webhook --timeout=120s

          kubectl exec vault-0 -- sh -c '
            export VAULT_ADDR=http://127.0.0.1:8200
            export VAULT_TOKEN=root

            vault kv put secret/digital-wallet/postgres password=smokepass123

            vault policy write digital-wallet-policy - <<EOF
          path "secret/data/digital-wallet/postgres" {
            capabilities = ["read"]
          }
          EOF

            vault auth enable kubernetes || true
            vault write auth/kubernetes/config \
              kubernetes_host="https://kubernetes.default.svc:443"

            vault write auth/kubernetes/role/digital-wallet-role \
              bound_service_account_names=digital-wallet-app-digital-wallet-chart \
              bound_service_account_namespaces=default \
              policies=digital-wallet-policy \
              ttl=1h
          '

      - name: Deploy Digital Wallet Chart with Built Image
        run: |
          IMAGE_REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          helm upgrade --install digital-wallet-app deploy-repo/charts/digital-wallet-chart \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="${{ github.sha }}" \
            --set replicaCount=1 \
            --set ingress.enabled=false \
            --wait --timeout=180s

      - name: Verify Vault Secret File & /healthz + /ready Endpoints
        run: |
          POD_NAME=$(kubectl get pods -l app.kubernetes.io/name=digital-wallet-chart -o jsonpath='{.items[0].metadata.name}')
          echo "Testing pod: $POD_NAME"

          kubectl exec "$POD_NAME" -c digital-wallet-chart -- test -s /vault/secrets/connectionstring

          kubectl port-forward "pod/$POD_NAME" 18080:8080 &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/healthz && curl -sf http://127.0.0.1:18080/ready; then
              echo "Smoke checks passed (/healthz and /ready returned 200)."
              exit 0
            fi
            sleep 2
          done

          echo "Smoke checks failed; dumping pod logs..."
          kubectl logs "$POD_NAME" -c digital-wallet-chart || true
          kubectl logs "$POD_NAME" -c vault-agent || true
          exit 1

  promote-deploy:
    name: Update Image Tag in Deploy Repo
    needs: [test-and-build, deployment-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Deploy Repository
        uses: actions/checkout@v4
        with:
          repository: Ivet1/digital-wallet-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy-repo

      - name: Commit and Push New Image SHA
        run: |
          cd deploy-repo
          FILE="charts/digital-wallet-chart/values.yaml"
          sed -i 's/tag: "[^"]*"/tag: "${{ github.sha }}"/' "$FILE"
          git diff "$FILE"
          if git diff --quiet "$FILE"; then
            echo "Image tag is already ${{ github.sha }}, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: update image tag to ${{ github.sha }}"
          git push origin main