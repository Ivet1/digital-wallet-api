name: Digital Wallet CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    name: Test, Build & Secure Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./DigitalWallet.Api
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('DigitalWallet.Api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --no-restore --configuration Release

      - name: Run All Unit & Integration Tests
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload Test Coverage Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: ./DigitalWallet.Api/**/TestResults/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally for Security Scan
        uses: docker/build-push-action@v5
        with:
          context: ./DigitalWallet.Api
          file: ./DigitalWallet.Api/deploy/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (Strict Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # -> Tova spir pipeline-a, ako nameri uyazvimosti!
          severity: 'CRITICAL,HIGH'

      - name: Log in to Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Secure Docker Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./DigitalWallet.Api
          file: ./DigitalWallet.Api/deploy/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  helm-validation:
    name: Validate Helm Chart
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Lint Helm Chart
        run: |
          helm lint DigitalWallet.Api/digital-wallet-chart/

      - name: Template Helm Manifests (Dry Run)
        run: |
          helm template DigitalWallet.Api/digital-wallet-chart/ \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }}

  deploy-to-staging:
    name: Deploy to Staging
    needs: [test-and-build, helm-validation]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Confirm Staging Deployment
        run: |
          echo "Staging deployment approved and verified for image tag: ${{ github.sha }}"