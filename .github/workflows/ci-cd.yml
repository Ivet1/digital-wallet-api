name: Digital Wallet CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    name: Test, Build & Containerize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          set -euo pipefail
          LOWER_REPO=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${LOWER_REPO}" >> "$GITHUB_ENV"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', './DigitalWallet.Tests/DigitalWallet.Tests.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore DigitalWallet.slnx

      - name: Build Project
        run: dotnet build DigitalWallet.slnx --no-restore --configuration Release

      - name: Run All Unit & Integration Tests
        run: dotnet test DigitalWallet.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload Test Coverage Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: '**/TestResults/'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./DigitalWallet.Api
          file: ./DigitalWallet.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployment-smoke-test:
    name: Deployment Smoke & E2E Test (kind + Vault + DB)
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout API Repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          set -euo pipefail
          LOWER_REPO=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${LOWER_REPO}" >> "$GITHUB_ENV"

      - name: Checkout Deploy Repository
        uses: actions/checkout@v4
        with:
          repository: Ivet1/digital-wallet-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy-repo

      - name: Create kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: wallet-smoke
          wait: 120s

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Install Vault & Configure Secret + Kubernetes Auth
        run: |
          set -euo pipefail

          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo update
          helm upgrade --install vault hashicorp/vault \
            --set "server.dev.enabled=true" \
            --set "server.dev.devRootToken=root" \
            --set "injector.enabled=true" \
            --wait --timeout=180s

          kubectl wait --for=condition=Ready pod/vault-0 --timeout=120s
          kubectl rollout status deployment/vault-agent-injector --timeout=120s || true
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=vault-agent-injector --timeout=120s

          VAULT_PF_PID=""
          cleanup_vault_pf() {
            if [ -n "${VAULT_PF_PID}" ] && kill -0 "${VAULT_PF_PID}" 2>/dev/null; then
              kill "${VAULT_PF_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup_vault_pf EXIT

          kubectl port-forward -n default svc/vault 8200:8200 >/tmp/vault-pf.log 2>&1 &
          VAULT_PF_PID=$!

          export VAULT_ADDR="http://127.0.0.1:8200"
          export VAULT_TOKEN="root"
          export ROLE_TTL="1h"

          echo "Waiting for Vault port-forward..."
          VAULT_READY=0
          for _ in $(seq 1 30); do
            if curl -sf "${VAULT_ADDR}/v1/sys/health" >/dev/null 2>&1; then
              VAULT_READY=1
              break
            fi
            sleep 2
          done

          if [ "$VAULT_READY" -ne 1 ]; then
            echo "Vault did not become reachable via port-forward."
            cat /tmp/vault-pf.log || true
            exit 1
          fi

          if [ -f "deploy-repo/vault/bootstrap/configure-vault.sh" ]; then
            sh deploy-repo/vault/bootstrap/configure-vault.sh
          else
            curl -fsSL https://raw.githubusercontent.com/Ivet1/digital-wallet-deploy/main/vault/bootstrap/configure-vault.sh -o /tmp/configure-vault.sh
            sh /tmp/configure-vault.sh
            rm -f /tmp/configure-vault.sh
          fi

          if ! vault auth list -format=json 2>/dev/null | grep -q '"kubernetes/"'; then
            vault auth enable kubernetes
          fi

          K8S_HOST="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          vault write auth/kubernetes/config kubernetes_host="${K8S_HOST}"

          vault policy write digital-wallet-policy - <<'POLICY'
          path "secret/data/digital-wallet/postgres" {
            capabilities = ["read"]
          }
          POLICY

          vault write auth/kubernetes/role/digital-wallet-role \
            bound_service_account_names=digital-wallet-app-digital-wallet-chart \
            bound_service_account_namespaces=default \
            policies=digital-wallet-policy \
            ttl="${ROLE_TTL}"

          vault kv put secret/digital-wallet/postgres password=smokepass123
          vault kv get -format=json secret/digital-wallet/postgres >/dev/null

      - name: Install ServiceMonitor CRD & Deploy Digital Wallet Chart
        run: |
          set -euo pipefail

          kubectl apply -f - <<'EOF'
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: servicemonitors.monitoring.coreos.com
          spec:
            group: monitoring.coreos.com
            names:
              kind: ServiceMonitor
              listKind: ServiceMonitorList
              plural: servicemonitors
              singular: servicemonitor
            scope: Namespaced
            versions:
              - name: v1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
          EOF

          kubectl delete service postgres-service --ignore-not-found=true
          kubectl delete pod postgres-smoke --ignore-not-found=true

          IMAGE_REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          helm upgrade --install digital-wallet-app deploy-repo/charts/digital-wallet-chart \
            --set image.repository="$IMAGE_REPO" \
            --set image.tag="${{ github.sha }}" \
            --set replicaCount=1 \
            --set ingress.enabled=false \
            --wait --timeout=180s

      - name: Verify Vault Secret File, Probes & End-to-End Wallet Flow
        run: |
          set -euo pipefail

          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=digital-wallet-chart --timeout=120s
          POD_NAME=$(kubectl get pods -l app.kubernetes.io/name=digital-wallet-chart -o jsonpath='{.items[0].metadata.name}')
          echo "Testing pod: $POD_NAME"

          kubectl exec "$POD_NAME" -c digital-wallet-chart -- test -s /vault/secrets/connectionstring

          API_PF_PID=""
          cleanup_all() {
            if [ -n "${API_PF_PID}" ] && kill -0 "${API_PF_PID}" 2>/dev/null; then
              kill "${API_PF_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup_all EXIT

          kubectl port-forward "pod/$POD_NAME" 18080:8080 >/tmp/api-pf.log 2>&1 &
          API_PF_PID=$!

          READY=0
          for _ in $(seq 1 40); do
            if kill -0 "${API_PF_PID}" 2>/dev/null && \
               curl -sf http://127.0.0.1:18080/healthz >/dev/null 2>&1 && \
               curl -sf http://127.0.0.1:18080/ready >/dev/null 2>&1 && \
               curl -sf http://127.0.0.1:18080/wallet/categories >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Smoke checks failed; dumping port-forward and pod logs..."
            cat /tmp/api-pf.log || true
            kubectl describe pod "$POD_NAME" || true
            kubectl logs "$POD_NAME" -c digital-wallet-chart || true
            kubectl logs "$POD_NAME" -c vault-agent || true
            exit 1
          fi

          echo "Running E2E tests against /wallet endpoints..."
          BASE_URL="http://127.0.0.1:18080"

          INCOME_STATUS=$(curl -s -o /tmp/e2e-income.json -w "%{http_code}" \
            -X POST "$BASE_URL/wallet/transactions" \
            -H "Content-Type: application/json" \
            -d '{"description":"E2E Salary","amount":100.00,"category":"Salary"}')
          echo "Income status: $INCOME_STATUS"
          test "$INCOME_STATUS" -eq 201

          EXPENSE_STATUS=$(curl -s -o /tmp/e2e-expense.json -w "%{http_code}" \
            -X POST "$BASE_URL/wallet/transactions" \
            -H "Content-Type: application/json" \
            -d '{"description":"E2E Food","amount":-30.00,"category":"Food"}')
          echo "Expense status: $EXPENSE_STATUS"
          test "$EXPENSE_STATUS" -eq 201

          BALANCE_JSON=$(curl -sf "$BASE_URL/wallet/balance")
          echo "Balance response: $BALANCE_JSON"
          echo "$BALANCE_JSON" | grep -qE '"currentBalance"\s*:\s*70(\.0+)?'
          echo "$BALANCE_JSON" | grep -qE '"totalIncome"\s*:\s*100(\.0+)?'
          echo "$BALANCE_JSON" | grep -qE '"totalExpense"\s*:\s*30(\.0+)?'

          OVERDRAFT_STATUS=$(curl -s -o /tmp/e2e-overdraft.json -w "%{http_code}" \
            -X POST "$BASE_URL/wallet/transactions" \
            -H "Content-Type: application/json" \
            -d '{"description":"E2E Overdraft","amount":-500.00,"category":"Food"}')
          echo "Overdraft status: $OVERDRAFT_STATUS"
          test "$OVERDRAFT_STATUS" -eq 422

          BALANCE_AFTER_422=$(curl -sf "$BASE_URL/wallet/balance")
          echo "Balance after 422: $BALANCE_AFTER_422"
          echo "$BALANCE_AFTER_422" | grep -qE '"currentBalance"\s*:\s*70(\.0+)?'

          echo "All smoke and E2E checks passed!"

  promote-deploy:
    name: Update Image Tag in Deploy Repo
    needs: [test-and-build, deployment-smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Deploy Repository
        uses: actions/checkout@v4
        with:
          repository: Ivet1/digital-wallet-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy-repo

      - name: Commit and Push New Image SHA
        run: |
          set -euo pipefail
          cd deploy-repo
          FILE="charts/digital-wallet-chart/values.yaml"
          sed -i 's/tag: "[^"]*"/tag: "${{ github.sha }}"/' "$FILE"
          git diff "$FILE"
          if git diff --quiet "$FILE"; then
            echo "Image tag is already ${{ github.sha }}, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: update image tag to ${{ github.sha }}"
          git push origin main