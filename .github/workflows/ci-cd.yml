name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-and-build:
    name: Test, Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore DigitalWallet.Api/DigitalWallet.Api.csproj

      - name: Build Project
        run: dotnet build DigitalWallet.Api/DigitalWallet.Api.csproj --no-restore --configuration Release

      - name: Run Tests & Enforce 80% Coverage
        run: |
          dotnet test DigitalWallet.Api/DigitalWallet.Api.csproj \
            --no-build \
            --configuration Release \
            --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:Threshold=80 \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./DigitalWallet.Api
          file: ./DigitalWallet.Api/deploy/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-staging:
    name: Update Helm Values
    needs: test-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git User
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Update Image Tag in Helm Values
        run: |
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' DigitalWallet.Api/digital-wallet-chart/values.yaml
          git add DigitalWallet.Api/digital-wallet-chart/values.yaml
          git commit -m "chore(staging): update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main