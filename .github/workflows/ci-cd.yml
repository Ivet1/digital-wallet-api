name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  DEPLOY_REPO: ivet1/digital-wallet-deploy

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test & scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Find the solution file
        run: |
          sln="$(git ls-files '*.sln' '*.slnx' | head -n 1)"
          [ -n "$sln" ] || { echo "no .sln / .slnx file found in the repository"; exit 1; }
          echo "SOLUTION=$sln" >> "$GITHUB_ENV"

      - name: Install SonarScanner & Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre
          dotnet tool install --global dotnet-sonarscanner

      - name: Restore Dependencies
        run: dotnet restore "$SOLUTION"

      - name: Begin SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"Ivet1_digital-wallet-api" \
            /o:"ivet1" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Build
        run: dotnet build "$SOLUTION" --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test "$SOLUTION" \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'

      - name: End SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  publish-image:
    name: Build & push image
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ github.sha }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lowercase image name
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./DigitalWallet.Api/deploy/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployment-test:
    name: Deployment test (kind + Vault)
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout deploy repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the deployment test against the pushed image
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
          TAG: ${{ needs.publish-image.outputs.tag }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: bash deploy/scripts/deployment-test.sh "$IMAGE" "$TAG" "$DIGEST"

  promote-to-staging:
    name: Promote to staging
    needs: [ publish-image, deployment-test ]
    runs-on: ubuntu-latest
    environment:
      name: staging
    concurrency:
      group: promote-staging
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout deploy repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy

      - name: Update the image tag in the staging environment
        env:
          IMAGE_TAG: ${{ needs.publish-image.outputs.tag }}
          APP_COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          cd deploy
          sed -i -E "s|^([[:space:]]*tag:).*|\1 \"${IMAGE_TAG}\"|" environments/staging/values.yaml

          if git diff --quiet; then
            echo "Staging already runs this image, nothing to promote."
            exit 0
          fi

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add environments/staging/values.yaml
          git commit -m "chore(staging): deploy digital-wallet-api ${IMAGE_TAG:0:7} [skip ci]" -m "Application commit: ${APP_COMMIT_URL}"

          git pull --rebase origin main
          git push origin HEAD:main
