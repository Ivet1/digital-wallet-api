replicaCount: 1

image:
  repository: digital-wallet-api
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "digital-wallet-role"
  vault.hashicorp.com/agent-inject-secret-db-password: "secret/data/digital-wallet/postgres"
  vault.hashicorp.com/agent-inject-template-db-password: |
    {{- with secret "secret/data/digital-wallet/postgres" -}}
    ConnectionStrings__Default=Host=postgres-service;Port=5432;Database=walletdb;Username=postgres;Password={{ .Data.data.POSTGRES_PASSWORD }}
    {{- end -}}

podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: digital-wallet.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: {}
affinity: {}

env: {}