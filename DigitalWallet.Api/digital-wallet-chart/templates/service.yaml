apiVersion: v1
kind: Secret
kind: Service
metadata:
  name: {{ include "digital-wallet-chart.fullname" . }}
  labels:
    {{- include "digital-wallet-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "digital-wallet-chart.selectorLabels" . | nindent 4 }}