apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "digital-wallet-chart.fullname" . }}-test-connection"
  labels:
    {{- include "digital-wallet-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "digital-wallet-chart.fullname" . }}:{{ .Values.service.port }}']
      resources:
        limits:
          cpu: "100m"
          memory: "128Mi"
        requests:
          cpu: "50m"
          memory: "64Mi"
  restartPolicy: Never