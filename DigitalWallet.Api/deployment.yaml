apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-api
  template:
    metadata:
      labels:
        app: wallet-api
    spec:
      containers:
      - name: wallet-api
        image: wallet-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        
        # Ресурси (Limits & Requests)
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Здравни проверки (Probes)
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5

        # Връзка с ConfigMap и Secret
        envFrom:
        - configMapRef:
            name: wallet-api-config
        - secretRef:
            name: wallet-api-secret
